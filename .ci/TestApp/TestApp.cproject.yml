project:
  description: Template application for driver build test

  # List of packs used by the project.
  packs:
    - pack: ARM::CMSIS-Driver_STM32
    - pack: ARM::CMSIS@^6.3.0
    - pack: ARM::CMSIS-Compiler@^2.3.0
    - pack: ARM::CMSIS-RTX@^5.9.1

  # List of source groups and files.
  groups:
    - group: Source Files
      files:
        - file: app_main.c

  # List of components used by the application.
  components:
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:RTOS2:Keil RTX5&Source

  # List of layers.
  layers:
    - layer: $Board-Layer$
      type: Board
